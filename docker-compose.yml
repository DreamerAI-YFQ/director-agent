services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_director_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_director}
      POSTGRES_USER: ${POSTGRES_USER:-director}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-director123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-director} -d $${POSTGRES_DB:-ai_director}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: ai_director_adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
