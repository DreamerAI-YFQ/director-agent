<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI编导Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="header" style="background:#1a1a2e;padding:12px 24px;display:flex;align-items:center;gap:12px;">
        <h1 style="font-size:18px;color:#00d4aa;">AI编导Agent</h1>
        <div style="display:flex;gap:4px;margin-left:20px;">
            <button onclick="switchPanel('chat')" style="background:#00d4aa;color:#0f0f0f;border:none;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:13px;" id="tab-chat">对话</button>
            <button onclick="switchPanel('history')" style="background:transparent;color:#888;border:1px solid #333;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:13px;" id="tab-history">历史</button>
            <button onclick="switchPanel('budget')" style="background:transparent;color:#888;border:1px solid #333;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:13px;" id="tab-budget">预算</button>
            <button onclick="switchPanel('review')" style="background:transparent;color:#888;border:1px solid #333;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:13px;" id="tab-review">审阅</button>
            <button onclick="switchPanel('dict')" style="background:transparent;color:#888;border:1px solid #333;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:13px;" id="tab-dict">词典</button>
            <button onclick="switchPanel('refs')" style="background:transparent;color:#888;border:1px solid #333;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:13px;" id="tab-refs">引用</button>
        </div>
        <span id="status" style="color:#888;font-size:12px;margin-left:auto;">连接中...</span>
    </div>
    <div id="skillBar" style="background:#12121e;padding:8px 24px;display:flex;align-items:center;gap:6px;overflow-x:auto;border-bottom:1px solid #2a2a4a;min-height:36px;font-size:11px;">
        <span style="color:#888;white-space:nowrap;">Skills:</span>
    </div>
    <div id="chat" style="flex:1;overflow-y:auto;padding:24px;"></div>
    <div id="panel-history" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
        <div style="background:#1a1a2e;padding:12px 24px;font-size:14px;font-weight:600;border-bottom:1px solid #2a2a4a;">历史会话</div>
        <div id="historyContent" style="padding:16px 24px;overflow-y:auto;flex:1;font-size:13px;">加载中...</div>
    </div>
    <div id="panel-budget" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
        <div style="background:#1a1a2e;padding:12px 24px;font-size:14px;font-weight:600;border-bottom:1px solid #2a2a4a;">预算状态</div>
        <div id="budgetContent" style="padding:16px 24px;overflow-y:auto;flex:1;font-size:13px;">加载中...</div>
    </div>
    <div id="panel-review" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
        <div style="background:#1a1a2e;padding:12px 24px;font-size:14px;font-weight:600;border-bottom:1px solid #2a2a4a;">候选标签审阅队列</div>
        <div id="reviewContent" style="padding:16px 24px;overflow-y:auto;flex:1;font-size:13px;">加载中...</div>
    </div>
    <div id="panel-dict" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
        <div style="background:#1a1a2e;padding:12px 24px;font-size:14px;font-weight:600;border-bottom:1px solid #2a2a4a;">词典版本管理</div>
        <div id="dictContent" style="padding:16px 24px;overflow-y:auto;flex:1;font-size:13px;">加载中...</div>
    </div>
    <div id="panel-refs" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
        <div style="background:#1a1a2e;padding:12px 24px;font-size:14px;font-weight:600;border-bottom:1px solid #2a2a4a;">引用追溯</div>
        <div id="refsContent" style="padding:16px 24px;overflow-y:auto;flex:1;font-size:13px;">加载中...</div>
    </div>
    <div style="padding:16px 24px;background:#1a1a2e;display:flex;gap:12px;">
        <textarea id="input" rows="1" placeholder="输入消息，回车发送..." style="flex:1;padding:12px 16px;border:1px solid #2a2a4a;border-radius:8px;background:#0f0f0f;color:#e0e0e0;font-size:14px;outline:none;resize:none;font-family:inherit;"></textarea>
        <button id="send" style="padding:12px 24px;background:#00d4aa;color:#0f0f0f;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">发送</button>
    </div>

    <script>
        // ===== Skill 固定展示 =====
        const SKILLS = [
            {name:'需求理解',emoji:'1'},{name:'策略思考',emoji:'2'},{name:'钩子设计',emoji:'3'},
            {name:'脚本骨架',emoji:'4'},{name:'文案撰写',emoji:'5'},{name:'文生图',emoji:'6'},
            {name:'图生视频',emoji:'7'},{name:'真人实拍',emoji:'8'},{name:'AB变体',emoji:'9'},
            {name:'自检',emoji:'10'}
        ];
        const skillBar = document.getElementById('skillBar');
        const skillNames = new Set(SKILLS.map(s => s.name));

        function applySkillProgress(progress) {
            renderSkillBar();
            return !!progress;
        }
        window.applySkillProgress = applySkillProgress;

        function looksLikeFinalDelivery(text) {
            if (!text) return false;
            const groups = [
                ['脚本', '脚本文案'],
                ['文生图', '文生图Prompt', 'image prompt'],
                ['图生视频', '图生视频Prompt', 'video prompt'],
                ['真人实拍', '实拍方案'],
                ['A/B', 'AB变体', 'A/B变体'],
                ['自检', '自检报告', '合规通过']
            ];
            return groups.every(group => group.some(keyword => text.includes(keyword)));
        }

        function markAllSkillsCompleted() {
            renderSkillBar();
        }

        function renderSkillBar() {
            let html = '<span style="color:#888;white-space:nowrap;font-size:11px;">Skills:</span>';
            SKILLS.forEach((s,i) => {
                html += `<span style="color:#00d4aa;font-size:11px;white-space:nowrap;"> ${s.name}</span>`;
                if (i < SKILLS.length - 1) html += '<span style="color:#00a887;">→</span>';
            });
            skillBar.innerHTML = html;
        }
        renderSkillBar();  // 初始化渲染

        document.getElementById('status').textContent = 'JS执行';

        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const statusEl = document.getElementById('status');
        let ws = null;
        let currentMsgEl = null;

    function connect(sessionId) {
        renderSkillBar();

        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        let url = `${proto}//${location.host}/ws`;
            if (sessionId) url += '?session_id=' + sessionId;
            ws = new WebSocket(url);

            ws.onopen = () => {
                statusEl.textContent = '已连接';
                statusEl.style.color = '#00d4aa';
            };
            ws.onclose = () => {
                statusEl.textContent = '已断开';
                statusEl.style.color = '#ff4444';
                setTimeout(connect, 2000);
            };
            ws.onerror = () => {
                statusEl.textContent = '连接错误';
                statusEl.style.color = '#ff4444';
            };
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'stream') {
                    if (!currentMsgEl) { currentMsgEl = createMsg('assistant'); }
                    currentMsgEl.textContent += data.content;
                    chat.scrollTop = chat.scrollHeight;
                } else if (data.type === 'error') {
                    createMsg('error', 'ERROR: ' + data.content);
                    currentMsgEl = null;
                    sendBtn.disabled = false;
                } else if (data.type === 'system') {
                    createMsg('system', data.content);
                } else if (data.type === 'tool') {
                    createMsg('tool', data.content);
                } else if (data.type === 'tool_done') {
                    createMsg('tool', data.content);
                } else if (data.type === 'skill_change') {
                    applySkillProgress(data.state);
                } else if (data.type === 'done') {
                    if (!applySkillProgress(data.progress) && currentMsgEl && looksLikeFinalDelivery(currentMsgEl.textContent)) {
                        markAllSkillsCompleted();
                    } else if (currentMsgEl && looksLikeFinalDelivery(currentMsgEl.textContent)) {
                        markAllSkillsCompleted();
                    }
                    currentMsgEl = null;
                    sendBtn.disabled = false;
                } else if (data.type === 'pipeline_progress') {
                    const icon = data.status === 'completed' ? 'OK' : data.status === 'failed' ? 'FAIL' : '...';
                    createMsg('system', icon + ' ' + data.stage + ' ' + data.status);
                }
            };
        }

        function createMsg(type, text) {
            const el = document.createElement('div');
            el.style.maxWidth = '80%';
            el.style.padding = '8px 14px';
            el.style.borderRadius = '8px';
            el.style.marginBottom = '8px';
            el.style.fontSize = '13px';
            el.style.whiteSpace = 'pre-wrap';
            el.style.wordBreak = 'break-word';

            if (type === 'user') { el.style.alignSelf = 'flex-end'; el.style.background = '#1a5c4c'; el.style.color = '#e0e0e0'; }
            else if (type === 'assistant') { el.style.alignSelf = 'flex-start'; el.style.background = '#2a2a3e'; el.style.color = '#e0e0e0'; }
            else if (type === 'system') { el.style.alignSelf = 'center'; el.style.background = 'transparent'; el.style.color = '#888'; el.style.fontSize = '12px'; }
            else if (type === 'tool') { el.style.alignSelf = 'flex-start'; el.style.background = '#1a1a2e'; el.style.color = '#00d4aa'; el.style.fontSize = '12px'; }
            else if (type === 'error') { el.style.alignSelf = 'center'; el.style.background = '#2a1a1a'; el.style.color = '#ff6666'; el.style.fontSize = '12px'; }

            el.textContent = text;
            chat.appendChild(el);
            chat.scrollTop = chat.scrollHeight;
            return el;
        }

        function sendMessage() {
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            createMsg('user', text);
            ws.send(JSON.stringify({ content: text }));
            input.value = '';
            sendBtn.disabled = true;
            currentMsgEl = null;
        }

        sendBtn.onclick = sendMessage;
        input.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        };

        // ===== 标签页切换 =====
        let currentPanel = 'chat';
        function switchPanel(name) {
            // Update tab buttons
            document.querySelectorAll('[id^=tab-]').forEach(b => {
                b.style.background = 'transparent'; b.style.color = '#888'; b.style.border = '1px solid #333';
            });
            const activeTab = document.getElementById('tab-' + name);
            if (activeTab) { activeTab.style.background = '#00d4aa'; activeTab.style.color = '#0f0f0f'; activeTab.style.border = 'none'; }
            // Hide all
            document.getElementById('chat').style.display = 'none';
            [
            'panel-history','panel-budget','panel-review','panel-dict','panel-refs'
            ].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
            // Show target
            if (name === 'chat') {
                document.getElementById('chat').style.display = '';
            } else {
                const panel = document.getElementById('panel-' + name);
                if (panel) panel.style.display = 'flex';
            }
            currentPanel = name;
            if (name === 'budget') loadBudget();
            if (name === 'review') loadReview();
            if (name === 'dict') loadDictVersions();
            if (name === 'refs') loadReferences();
            if (name === 'history') loadHistory();
        }

        // ===== 预算 =====
        async function loadBudget() {
            const el = document.getElementById('budgetContent');
            try {
                const r = await fetch('/api/pipeline/budget');
                const data = await r.json();
                const b = (data && data.budget) || {};
                el.innerHTML = `<div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;padding:14px;margin-bottom:8px;">
                    <div style="display:flex;justify-content:space-between;"><span style="color:#888">小时成本</span><span style="color:#00d4aa">$${b.hourly_cost||0} / $${b.hourly_limit||5}</span></div>
                    <div style="height:6px;background:#2a2a4a;border-radius:3px;margin-top:4px;"><div style="height:100%;background:#00d4aa;border-radius:3px;width:${Math.min(b.hourly_pct||0,100)}%"></div></div>
                </div>
                <div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;padding:14px;margin-bottom:8px;">
                    <div style="display:flex;justify-content:space-between;"><span style="color:#888">每日成本</span><span style="color:#00d4aa">$${b.daily_cost||0} / $${b.daily_limit||20}</span></div>
                    <div style="height:6px;background:#2a2a4a;border-radius:3px;margin-top:4px;"><div style="height:100%;background:#00d4aa;border-radius:3px;width:${Math.min(b.daily_pct||0,100)}%"></div></div>
                </div>
                <div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;padding:14px;">
                    <span style="color:#888">总调用次数: </span><span style="color:#e0e0e0">${b.total_calls||0}</span>
                </div>`;
            } catch(e) { el.textContent = '加载失败'; }
        }

        // ===== 审阅 =====
        async function loadReview() {
            const el = document.getElementById('reviewContent');
            try {
                const [s,c] = await Promise.all([fetch('/api/review/stats'), fetch('/api/review/candidates?status=pending&limit=10')]);
                const stats = await s.json();
                const cand = await c.json();
                let html = `<div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;padding:14px;margin-bottom:8px;">
                    <div style="display:flex;gap:16px;font-size:12px;">
                        <span style="color:#ffaa00">待审: ${stats.pending||0}</span>
                        <span style="color:#00d4aa">已批: ${stats.approved||0}</span>
                        <span style="color:#ff4466">已拒: ${stats.rejected||0}</span>
                    </div>
                </div>`;
                if (cand.candidates && cand.candidates.length) {
                    html += cand.candidates.slice(0,8).map(c => `<div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:4px;padding:8px 12px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-size:12px;">
                        <span>${c.tag_text} <span style="color:#666">(${Math.round(c.confidence_score*100)}%)</span></span>
                        <span>
                            <button onclick="decideTag(${c.candidate_id},'approved','terms')" style="background:#00d4aa;color:#000;border:none;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px;margin-right:4px;">批准</button>
                            <button onclick="decideTag(${c.candidate_id},'rejected')" style="background:#ff4466;color:#fff;border:none;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px;">拒绝</button>
                        </span>
                    </div>`).join('');
                } else { html += '<div style="color:#888;font-size:12px;">暂无待审候选</div>'; }
                el.innerHTML = html;
            } catch(e) { el.textContent = '加载失败'; }
        }

        async function decideTag(id, decision, dict) {
            await fetch('/api/review/decide', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify([{candidate_id:id,decision,target_dict:dict||''}])});
            loadReview();
        }

        // ===== 词典 =====
        async function loadDictVersions() {
            const el = document.getElementById('dictContent');
            try {
                const [r1, r2] = await Promise.all([fetch('/api/dict/monitor'), fetch('/api/compliance/scripts')]);
                const m = await r1.json();
                const scr = await r2.json();
                let html = '<div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;padding:14px;margin-bottom:8px;">';
                html += '<div style="font-size:13px;font-weight:600;margin-bottom:4px;">词典统计</div>';
                (m.dict_volumes||[]).forEach(v => {
                    html += `<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;"><span>${v.dict_type}</span><span style="color:#888">${v.count}条 v${v.latest_version||1}</span></div>`;
                });
                html += '</div>';
                const n = m.novel_stats||{};
                html += `<div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;padding:14px;margin-bottom:8px;font-size:12px;">
                    <div>Novel: <span style="color:#ffaa00">待审${n.pending||0}</span> <span style="color:#00d4aa">已批${n.approved||0}</span> <span style="color:#ff4466">已拒${n.rejected||0}</span></div>
                    ${m.stale_compliance_checks>0?`<div style="color:#ffaa00;margin-top:4px;">过期合规检查: ${m.stale_compliance_checks}条</div>`:''}
                </div>`;
                if (scr.scripts && scr.scripts.length) {
                    html += '<div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;padding:14px;font-size:12px;"><div style="font-weight:600;margin-bottom:4px;">时间旅行</div>';
                    scr.scripts.slice(0,6).forEach(s => {
                        html += `<div onclick="timeTravel('${s.script_id}')" style="cursor:pointer;padding:3px 0;display:flex;justify-content:space-between;"><span>${s.script_id.slice(0,20)}...</span><span style="color:#888">${s.check_count}次</span></div>`;
                    });
                    html += '</div>';
                }
                el.innerHTML = html;
            } catch(e) { el.textContent = '加载失败'; }
        }

        async function timeTravel(scriptId) {
            const r = await fetch('/api/compliance/compare/' + scriptId);
            const d = await r.json();
            let msg = `脚本: ${d.script_id}\n检查次数: ${d.total_checks}\n跨${d.version_count||0}个版本\n\n`;
            (d.versions||[]).forEach(v => { msg += `[${JSON.stringify(v.dict_versions)}]: ${v.count}条, pass:${v.risks.pass||0} warn:${v.risks.warning||0} error:${v.risks.error||0}\n`; });
            if (confirm(msg + '\n是否用当前最新词典重新评估？')) {
                await fetch('/api/compliance/reevaluate/' + scriptId, {method:'POST'});
                alert('重评估完成！');
                loadDictVersions();
            }
        }

        // ===== 引用 =====
        async function loadReferences() {
            const el = document.getElementById('refsContent');
            try {
                const [n,st] = await Promise.all([fetch('/api/references'), fetch('/api/references/stale')]);
                const normal = await n.json();
                const stale = await st.json();
                let html = `<div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;padding:14px;margin-bottom:8px;">
                    <div style="display:flex;justify-content:space-between;font-size:12px;"><span>活跃引用</span><span style="color:#00d4aa">${normal.count||0}</span></div>
                    ${stale.count>0?`<div style="display:flex;justify-content:space-between;font-size:12px;margin-top:4px;"><span style="color:#ffaa00">过期引用</span><span style="color:#ffaa00">${stale.count}</span></div><button onclick="rerunStale()" style="margin-top:6px;background:#00d4aa;color:#000;border:none;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;">清理</button>`:''}
                </div>`;
                if (stale.stale_refs && stale.stale_refs.length) {
                    html += '<div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;padding:14px;font-size:12px;"><div style="color:#ffaa00;font-weight:600;margin-bottom:4px;">过期引用</div>';
                    stale.stale_refs.slice(0,5).forEach(r => { html += `<div style="padding:2px 0;">${r.source_stage} → ${r.target_stage} <span style="color:#ffaa00">${r.status}</span></div>`; });
                    html += '</div>';
                }
                html += '<div style="margin-top:8px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;padding:14px;font-size:12px;">';
                html += '<div style="font-weight:600;margin-bottom:4px;">测试升级Prompt</div>';
                html += '<button onclick="testUpgrade(\'pipeline_P3_结构叙事\',\'1.1.0\',\'1.1\')" style="background:#00d4aa;color:#000;border:none;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px;margin-right:4px;">升级P3</button>';
                html += '<button onclick="testUpgrade(\'pipeline_P1_视觉要素\',\'1.1.0\',\'1.1\')" style="background:#00d4aa;color:#000;border:none;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px;">升级P1</button>';
                html += '</div>';
                el.innerHTML = html;
            } catch(e) { el.textContent = '加载失败'; }
        }

        async function rerunStale() {
            await fetch('/api/references/rerun-stale', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
            loadReferences();
        }

        async function testUpgrade(name, ver, schema) {
            const r = await fetch('/api/prompt-versions/'+name+'/upgrade', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:ver,schema_version:schema,changelog:'test',breaking_changes:['test']})});
            const d = await r.json();
            alert(d.success?`升级成功: ${d.impact?.stale_marked||0}条过期`:'失败: '+(d.error||''));
            loadReferences();
        }

        // ===== 历史会话 =====
        let currentSessionId = null;

        async function loadHistory() {
            const el = document.getElementById('historyContent');
            try {
                const r = await fetch('/api/sessions?limit=20');
                const data = await r.json();
                if (!data.sessions || !data.sessions.length) { el.textContent = '暂无历史会话'; return; }
                el.innerHTML = data.sessions.map(s => {
                    const d = new Date(s.last_active);
                    const ts = d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
                    return `<div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:6px;padding:10px 14px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;" onclick="viewSession('${s.session_id}')">
                        <span>${s.session_id===currentSessionId?'● ':''}${s.session_id.slice(5,13)}...</span>
                        <span><span style="color:#888;margin-right:8px;">${s.msg_count}条 ${ts}</span><button style="background:#333;color:#888;border:none;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px;" onclick="event.stopPropagation();viewSession('${s.session_id}')">查看</button></span>
                    </div>`;
                }).join('');
            } catch(e) { el.textContent = '加载失败'; }
        }

        async function viewSession(sessionId) {
            if (sessionId === currentSessionId) { switchPanel('chat'); return; }
            const r = await fetch('/api/sessions/' + sessionId + '/history');
            const data = await r.json();
            const msgs = data.messages || [];
            chat.innerHTML = '';
            msgs.forEach(m => {
                if (m.role === 'user') createMsg('user', m.content);
                else if (m.role === 'assistant') createMsg('assistant', m.content);
            });
            currentSessionId = sessionId;
            switchPanel('chat');
            if (ws) ws.close();
            connect(sessionId);
            createMsg('system', '已加载历史会话（' + msgs.length + '条消息）');
        }

        connect();
    </script>
</body>
</html>
